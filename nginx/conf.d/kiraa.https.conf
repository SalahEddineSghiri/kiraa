server {
  listen 80;
  server_name kiraa.souki.io;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 301 https://kiraa.souki.io$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name kiraa.souki.io;
  client_max_body_size 10m;
  ssl_certificate __TLS_CERT_FILE__;
  ssl_certificate_key __TLS_KEY_FILE__;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/templates/security_headers;

  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = /api/health {
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
  location = /api/chat {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params;
    proxy_read_timeout 300s;
  }
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
  location / {
    proxy_pass http://app:3000;
    include /etc/nginx/conf.d/proxy_params;
  }
}
